name: Research data download

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scans-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install yfinance pandas pyarrow lxml
      - name: Download
        run: python research/fetch_research_data.py
      - name: Commit data
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          git add research/data/
          git commit -m "research data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase
          git push
