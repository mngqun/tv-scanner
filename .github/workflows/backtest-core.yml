name: Backtest core bucket SPY/QQQ (protocol 2026-11-07 part B)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy yfinance
      - run: python backtest/core/core.py
      - name: Commit results
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          git add backtest/core/results/
          git commit -q -m "core bucket results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
