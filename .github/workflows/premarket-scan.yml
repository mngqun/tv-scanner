name: Pre-market TradingView scan

on:
  schedule:
    # GitHub cron is UTC (runs between ~07:05 and 09:05 ET across EDT/EST).
    # GitHub often delays scheduled runs 10-60 min, so fire several times; latest file wins.
    - cron: "5 11 * * 1-5"
    - cron: "35 11 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "35 12 * * 1-5"
    - cron: "5 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scans
        run: python tv_scan.py
      - name: Commit results
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          git add scans/
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase
          git push
