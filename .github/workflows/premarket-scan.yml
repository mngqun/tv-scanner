name: Pre-market TradingView scan

on:
  schedule:
    # GitHub cron is UTC. Two runs cover both US daylight and standard time:
    # 12:20 UTC = 08:20 ET (EDT) / 07:20 ET (EST); 13:20 UTC = 09:20 ET (EDT) / 08:20 ET (EST)
    - cron: "20 12 * * 1-5"
    - cron: "20 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scans
        run: python tv_scan.py
      - name: Commit results
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          git add scans/
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase
          git push
