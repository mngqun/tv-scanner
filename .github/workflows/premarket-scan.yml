name: Pre-market TradingView scan

on:
  # Primary trigger: the daily brief calls workflow_dispatch at brief time (GitHub's scheduler
  # proved unreliable: scheduled runs were skipped or delayed by hours).
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated tickers for a quote check (e.g. UNH,GS)"
        required: false
        default: ""
  # Backup schedule only (UTC, ~07:05-09:05 ET). May be delayed or skipped by GitHub.
  schedule:
    - cron: "5 11 * * 1-5"
    - cron: "35 11 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "35 12 * * 1-5"
    - cron: "5 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: scans-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scans
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: python tv_scan.py
      - name: Commit results
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          git add scans/
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase
          git push
