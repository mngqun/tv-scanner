name: Paper broker (Alpaca PAPER)

# Ticks are idempotent: each one does whatever is due at the current New York time.
# Cron is UTC and set for US Eastern STANDARD time (UTC-5, 1 Nov 2026 - 14 Mar 2027).
# Move every hour back by one when DST starts (14 Mar 2027).
on:
  schedule:
    - cron: "37 14 * * 1-5"   # 09:37 ET  queue (open-time entries)
    - cron: "01 15 * * 1-5"   # 10:01 ET  queue (10:00 entries)
    - cron: "17 15 * * 1-5"   # 10:17 ET  ORB + queue
    - cron: "33 15 * * 1-5"   # 10:33 ET  ORB backup
    - cron: "32 16 * * 1-5"   # 11:32 ET  cancel unfilled entries
    - cron: "52 18 * * 1-5"   # 13:52 ET  early flat-by (event days)
    - cron: "46 20 * * 1-5"   # 15:46 ET  flatten
    - cron: "53 20 * * 1-5"   # 15:53 ET  flatten backup
    - cron: "10 21 * * 1-5"   # 16:10 ET  ledger
  workflow_dispatch:
    inputs:
      action:
        description: "tick | check | test | flatten"
        required: true
        default: "tick"
      flat_by:
        description: "ORB flat-by HH:MM NY for today (default 15:45)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-broker
  cancel-in-progress: false

env:
  TOOLS_REPO: https://github.com/Jakeschincariol/day-trader-skill.git
  TOOLS_SHA: 3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q curl_cffi pymongo
      - name: Fetch tools (pinned commit)
        run: |
          git init -q vendor/day-trader-skill
          cd vendor/day-trader-skill
          git fetch -q --depth 1 "$TOOLS_REPO" "$TOOLS_SHA"
          git checkout -q FETCH_HEAD
      - name: Run
        env:
          ACTION: ${{ github.event.inputs.action || 'tick' }}
          FLAT_BY: ${{ github.event.inputs.flat_by }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_PAPER_KEY_ID_B: ${{ secrets.ALPACA_PAPER_KEY_ID_B }}
          ALPACA_PAPER_SECRET_KEY_B: ${{ secrets.ALPACA_PAPER_SECRET_KEY_B }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -o pipefail
          mkdir -p scans/paper
          python paper_broker.py "$ACTION" 2>&1 | tee "scans/paper/run_${ACTION}.log"
      - name: Commit
        if: always()
        run: |
          git config user.name "tv-scanner-bot"
          git config user.email "tv-scanner-bot@users.noreply.github.com"
          rm -f trader_state/trader/config.json
          git add scans/paper paper scans/trader trader_state 2>/dev/null || true
          git commit -q -m "paper ${{ github.event.inputs.action || 'tick' }} $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && break
            sleep 5
          done
